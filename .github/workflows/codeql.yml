name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 2"
  workflow_dispatch:
permissions:
  security-events: write
  contents: read
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            /*
            !/client-files/
            !/server-files/
          sparse-checkout-cone-mode: false
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
      - uses: github/codeql-action/analyze@v4
